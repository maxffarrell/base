# Set persistent BETTER_AUTH_SECRET and POSTGRES_PASSWORD before starting.
services:
  app:
    image: ghcr.io/maxffarrell/base:latest
    build: .
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgres://base:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (URL-encode special characters)}@db:5432/base
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      BASE_ENTERPRISE_KEY: ${BASE_ENTERPRISE_KEY:-}
      OUTBOUND_PRIVATE_ORIGINS: ${OUTBOUND_PRIVATE_ORIGINS:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: base
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: base
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U base']
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
